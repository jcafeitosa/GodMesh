[package]
name = "godmesh-federation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
snapshot-harness = []
relay-harness = []

# Versões resolvidas em 18/11/2026 pela API do crates.io (ver
# `docs/09-equipe/evidencias/2026-11-18-integracao-federacao.md`). ADR-071 fixa
# `quinn`/`rustls`/`ed25519-dalek`/`rcgen`; `x509-parser` entra só para **ler**
# o SubjectPublicKeyInfo do certificado do par — não faz cifra nem verificação.
[dependencies]
ed25519-dalek = { version = "3.0.0", features = ["alloc", "pkcs8"] }
getrandom = "0.4.3"
hex = "0.4.3"
quinn = { version = "0.11.12", default-features = false, features = ["log", "runtime-tokio", "rustls-ring"] }
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["logging", "ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["raw_value"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
utoipa = "6.0.0"
x509-parser = "0.18.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

[lints]
workspace = true
