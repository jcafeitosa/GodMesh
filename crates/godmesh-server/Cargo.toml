[package]
name = "godmesh-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
snapshot-harness = ["godmesh-federation/snapshot-harness"]

[dependencies]
godmesh-core = { path = "../godmesh-core" }
godmesh-emergency = { path = "../godmesh-emergency" }
godmesh-federation = { path = "../godmesh-federation" }
godmesh-host = { path = "../godmesh-host" }
godmesh-identity = { path = "../godmesh-identity", features = ["serde"] }
godmesh-policy = { path = "../godmesh-policy" }
godmesh-protocol = { path = "../godmesh-protocol" }
godmesh-sync = { path = "../godmesh-sync" }

axum = "0.8.9"
getrandom = "0.4.3"
hex = "0.4.3"
httparse = "=1.10.1"
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["service", "tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false }
utoipa = "6.0.0"

[[bin]]
name = "godmesh-server"
path = "src/main.rs"

[lints]
workspace = true
