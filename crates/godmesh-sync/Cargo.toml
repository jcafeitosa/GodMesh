[package]
name = "godmesh-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# sqlx e tokio já eram dependências resolvidas do workspace (crate
# `godmesh-server`); trazê-las para cá não adiciona dependência externa nova.
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true