[workspace]
resolver = "3"
members = [
    "crates/godmesh-protocol",
    "crates/godmesh-identity",
    "crates/godmesh-sync",
    "crates/godmesh-policy",
    "crates/godmesh-emergency",
    "crates/godmesh-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/godmesh/godmesh"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
